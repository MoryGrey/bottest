<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>Такси ПРЕСТИЖ — Заказ</title>
	<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
	<link rel="stylesheet" href="styles.css" />
	<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
	<div id="app">
		<div id="map"></div>
		<div id="panel">
			<h1>Такси «ПРЕСТИЖ»</h1>
			<form id="order-form">
				<label>
					Откуда
					<input id="from-input" type="text" placeholder="Адрес отправления" autocomplete="off" />
				</label>
				<label>
					Куда
					<input id="to-input" type="text" placeholder="Адрес назначения" autocomplete="off" />
				</label>
				<div class="row">
					<label class="grow">
						Тариф
						<select id="tariff">
							<option value="econom">Эконом</option>
							<option value="comfort">Комфорт</option>
							<option value="business">Бизнес</option>
						</select>
					</label>
					<label class="grow">
						Оплата
						<select id="payment">
							<option value="cash">Наличными</option>
							<option value="card">Перевод</option>
						</select>
					</label>
				</div>
				<button type="submit" id="submit-btn">Заказать</button>
			</form>
			<p class="hint">Нажмите по карте, чтобы поставить точку для активного поля (Откуда/Куда).</p>
		</div>
	</div>
	<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
	<script src="app.js"></script>
</body>
</html>
