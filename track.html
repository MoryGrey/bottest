<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Отслеживание водителя</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    html,body,#map{height:100%;margin:0}
    #info{position:absolute;left:8px;top:8px;z-index:500;background:rgba(0,0,0,.6);color:#fff;padding:8px 10px;border-radius:8px;font:14px/1.3 system-ui}
  </style>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="track.js" defer></script>
  <script>
    if (window.Telegram && Telegram.WebApp) {
      Telegram.WebApp.expand();
      Telegram.WebApp.enableClosingConfirmation();
    }
  </script>
  <meta name="color-scheme" content="dark light">
  <meta name="theme-color" content="#121212">
  <meta name="apple-mobile-web-app-status-bar-style" content="#121212">
</head>
<body>
  <div id="map"></div>
  <div id="info">Поиск геолокации водителя…</div>
</body>
</html>
